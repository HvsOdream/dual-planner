<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<title>DUAL Planner v3</title>
<style>
:root {
  --primary: #1F4E79;
  --primary-light: #D6E4F0;
  --primary-dark: #163A5C;
  --bg: #F4F3EF;
  --card: #FFFFFF;
  --text: #22303C;
  --text-2: #52514e;
  --muted: #898781;
  --border: #E1E0D9;
  --hairline: rgba(11,11,11,0.10);
  --pa: #D03B3B; --pa-bg: #FBEAEA;
  --pb: #C98500; --pb-bg: #FCF3E0;
  --pc: #0CA30C; --pc-bg: #E9F6E9;
  --viz-1: #2a78d6;
  --seq-100:#cde2fb; --seq-200:#9ec5f4; --seq-350:#5598e7; --seq-500:#256abf; --seq-650:#104281;
  --good: #0ca30c;
  --accent: #B4622D;
  --accent-bg: #F7EDE4;
  --shadow: 0 2px 10px rgba(20,30,40,0.06);
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Noto Sans KR', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding-bottom: calc(28px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
  line-height: 1.45;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }

/* ─── Header ─── */
.header {
  background: var(--primary); color: #fff;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.header h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.2px; }
.header .sub { font-size: 10px; opacity: .65; font-weight: 500; }
.hdr-right { display: flex; align-items: center; gap: 6px; }
.hdr-btn {
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28);
  border-radius: 9px; padding: 6px 10px; color: #fff; font-size: 12px; font-weight: 600;
}
.hdr-btn:active { background: rgba(255,255,255,.3); }
.hdr-btn.syncing { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
.cloud-status { font-size: 10px; color: rgba(255,255,255,.65); }

/* ─── Layout ─── */
.wrap { max-width: 720px; margin: 0 auto; padding: 14px 14px 24px; }
.page { display: none; }
.page.active { display: block; }
.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); border: 1px solid var(--hairline);
  padding: 14px; margin-bottom: 12px;
}
.card h3 { font-size: 13px; font-weight: 800; color: var(--primary); margin-bottom: 10px; display:flex; align-items:center; gap:6px; }
.sec-note { font-size: 11px; color: var(--muted); font-weight: 500; }

/* ─── Sub navigation (오늘 = 홈) ─── */
.subnav { display:flex; gap:6px; margin: 0 0 12px; align-items:center; flex-wrap:wrap; }
.nav-chip {
  background:#fff; border:1px solid var(--border); border-radius:999px;
  padding: 8px 14px; font-size: 12.5px; font-weight:700; color: var(--text-2);
  box-shadow: var(--shadow); display:inline-flex; align-items:center; gap:5px;
  text-decoration: none;
}
.nav-chip.ext { color: var(--primary); }
.subnav .spacer { flex: 1; }
/* 어제 돌아보기 */
.yday-summary { font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.yday-refl { font-size: 12.5px; color: var(--muted); font-style: italic; margin-bottom: 6px; }
.yday-row { display:flex; align-items:center; gap:8px; padding: 6px 0; border-top: 1px solid var(--border); }
.yday-row:first-of-type { border-top: none; }
.yday-title { flex:1; min-width:0; font-size: 13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav-chip:active { background: var(--primary-light); }
.nav-chip.back { color: var(--primary); border-color: var(--primary-light); }
.subnav .pgtitle { font-size: 15px; font-weight: 800; margin-left: 4px; }
/* 오늘 2컬럼 (좌: 나침반·일정 / 우: 투두) */
.today-cols { display: block; }
@media (min-width: 768px) {
  .today-cols { display: grid; grid-template-columns: 5fr 7fr; gap: 16px; align-items: start; }
  .tc-right .task-group-label:first-child { margin-top: 0; }
}
/* 오늘 일정 (구글 캘린더) */
.ev-card { padding: 12px 14px; }
.ev-row { display:flex; align-items:baseline; gap:10px; padding: 5px 0; }
.ev-time { font-size: 12px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; width: 88px; flex-shrink: 0; }
.ev-time.allday { color: var(--accent); }
.ev-title { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; }
.ev-row.past { opacity: .45; }
.ev-row.past .ev-title { text-decoration: line-through; }
.ev-row.now { background: var(--primary-light); border-radius: 8px; padding: 5px 8px; margin: 0 -8px; }
.ev-now-badge { font-size: 10px; font-weight: 800; color: #fff; background: var(--primary); border-radius: 999px; padding: 1px 7px; flex-shrink: 0; }
.ev-tomorrow { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 6px; border-top: 1px solid var(--border); padding-top: 7px; }
/* 이번 주 빅록 스트립 */
.strip-card { padding: 12px 14px; }
.strip-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 2px; }
.strip-head h3 { margin-bottom: 0; }
.strip-theme { font-size: 12.5px; color: var(--text-2); font-style: italic; margin: 4px 0 6px; }
.strip-row { display:flex; align-items:center; gap:8px; padding: 6px 0; border-top: 1px solid var(--border); }
.strip-row:first-of-type { border-top: none; }
.strip-title { flex:1; min-width:0; font-size: 13px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.strip-done-note { font-size: 11.5px; color: var(--good); font-weight: 700; padding-top: 6px; }
.strip-sent { font-size: 11px; color: var(--good); font-weight: 800; white-space:nowrap; }
.strip-cta {
  width:100%; background: var(--primary); color:#fff; border:none; border-radius: 10px;
  padding: 11px; font-size: 13.5px; font-weight: 800; margin-top: 6px;
}
.sunday-card {
  background: linear-gradient(135deg, #3d2c63, #5b4491); color:#fff;
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  box-shadow: var(--shadow); font-size: 13.5px; font-weight: 600;
}
.sunday-card button { background: rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius: 9px; padding: 8px 12px; font-size: 12.5px; font-weight:800; white-space:nowrap; }

/* ─── 오늘 ─── */
.today-head { display:flex; align-items:flex-end; justify-content:space-between; margin: 4px 2px 12px; }
.today-date { font-size: 21px; font-weight: 800; letter-spacing:-0.3px; }
.today-sub { font-size: 12px; color: var(--text-2); margin-top:2px; }
.streak-chip {
  background: var(--accent-bg); color: var(--accent); border: 1px solid var(--hairline);
  border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 800;
}
.achieved-banner {
  background: linear-gradient(135deg, #1F4E79, #2a78d6); color:#fff;
  border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px;
  font-weight: 700; font-size: 14px; display:flex; gap:8px; align-items:center;
}
.recover-card {
  background: var(--accent-bg); border: 1px solid var(--hairline); border-radius: var(--radius);
  padding: 12px 14px; margin-bottom: 12px; font-size: 13px; color: var(--text);
  display:flex; justify-content:space-between; align-items:center; gap:10px;
}
.recover-card button {
  background: var(--accent); color:#fff; border:none; border-radius: 9px;
  padding: 8px 12px; font-size: 12px; font-weight:700; white-space:nowrap;
}
.task-group-label { font-size: 11px; font-weight: 800; color: var(--muted); margin: 12px 4px 6px; letter-spacing: .5px; }
.task-row {
  background: var(--card); border: 1px solid var(--hairline); border-radius: 12px;
  padding: 10px 12px; margin-bottom: 6px; display:flex; align-items:center; gap:10px;
  box-shadow: var(--shadow);
}
.task-row.done { opacity: .55; }
.task-row.done .t-title { text-decoration: line-through; }
.chk {
  width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--border);
  background:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size: 14px; color:#fff; border: 2px solid #c9c8c1; padding:0;
}
.chk.on { background: var(--primary); border-color: var(--primary); }
.pri-badge {
  width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; border:none;
  font-size: 13px; font-weight: 800; display:flex; align-items:center; justify-content:center;
}
.pri-A { background: var(--pa-bg); color: var(--pa); }
.pri-B { background: var(--pb-bg); color: var(--pb); }
.pri-C { background: var(--pc-bg); color: var(--pc); }
.t-main { flex:1; min-width:0; }
.t-title { font-size: 14px; font-weight: 600; word-break: break-all; }
.t-link { font-size: 11px; color: var(--text-2); margin-top: 2px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.chip {
  display:inline-flex; align-items:center; gap:3px;
  background: var(--primary-light); color: var(--primary-dark);
  border-radius: 999px; padding: 1px 8px; font-size: 10px; font-weight: 700;
}
.chip.warn { background: var(--pb-bg); color: var(--pb); }
.x-btn { background:none; border:none; color: var(--muted); font-size: 15px; padding: 4px; flex-shrink:0; }
.x-btn.confirm { color: var(--pa); font-size: 11px; font-weight: 800; }
.add-bar { display:flex; gap:6px; margin-top: 10px; }
.pri-select { display:flex; border:1px solid var(--border); border-radius: 10px; overflow:hidden; background:#fff; flex-shrink:0; }
.pri-select button { border:none; background:#fff; width: 34px; font-weight: 800; font-size: 13px; color: var(--muted); padding: 9px 0; }
.pri-select button.sel-A { background: var(--pa-bg); color: var(--pa); }
.pri-select button.sel-B { background: var(--pb-bg); color: var(--pb); }
.pri-select button.sel-C { background: var(--pc-bg); color: var(--pc); }
.add-bar input {
  flex:1; min-width:0; border:1px solid var(--border); border-radius: 10px; padding: 9px 12px;
  font-size: 14px; background:#fff;
}
.add-bar .go { background: var(--primary); color:#fff; border:none; border-radius: 10px; padding: 0 14px; font-weight:700; font-size:13px; flex-shrink:0; }
.empty-hint { text-align:center; color: var(--muted); font-size: 13px; padding: 22px 10px; }
.reflect-box textarea, .one-input {
  width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  font-size: 14px; background:#fff; resize: none;
}
.reflect-saved { font-size: 11px; color: var(--good); font-weight: 700; margin-top: 6px; }

/* ─── 주간 나침반 ─── */
.week-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; gap:8px; }
.week-nav .wlabel { font-weight: 800; font-size: 15px; text-align:center; flex:1; }
.week-nav .wlabel .range { display:block; font-size: 11px; color: var(--muted); font-weight:600; }
.wnav-btn { background:#fff; border:1px solid var(--border); border-radius: 9px; width: 36px; height: 36px; font-size: 15px; color: var(--text-2); }
.wnav-this { background:#fff; border:1px solid var(--border); border-radius: 9px; padding: 0 10px; height:36px; font-size: 12px; font-weight:700; color: var(--primary); }
.week-panels { display: block; }
.panel-last { display: none; }
.panel-last.mobile-open { display: block; }
.panel-last .card { background: #F1F0EC; opacity: .85; }
.panel-last-title { font-size: 12px; font-weight: 800; color: var(--muted); margin: 4px 2px 8px; }
.toggle-last {
  width:100%; background:none; border:1px dashed var(--border); border-radius: 10px;
  padding: 9px; color: var(--muted); font-size: 12px; font-weight: 700; margin-bottom: 12px;
}
@media (min-width: 768px) {
  .wrap { max-width: 1400px; padding: 16px 28px 24px; }
  .week-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .panel-last { display: block !important; }
  .toggle-last { display: none; }
}
.saw-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.saw-item { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.saw-item .lbl { font-size: 11px; font-weight: 800; color: var(--text-2); margin-bottom: 4px; }
.saw-item input { width:100%; border:none; background:none; font-size: 13px; padding: 2px 0; outline:none; }
.saw-item input::placeholder, .one-input::placeholder { color: #b9b7af; }
.role-block { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
.role-block:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }
.role-head { display:flex; align-items:center; gap:6px; font-size: 13px; font-weight: 800; margin-bottom: 6px; }
.role-head .cnt { font-size: 10px; color: var(--muted); font-weight: 600; }
.wg-row { display:flex; align-items:flex-start; gap:8px; padding: 6px 0; }
.wg-row .t-main { padding-top: 1px; }
.wg-row .t-title { font-size: 13.5px; }
.wg-actions { display:flex; gap:2px; flex-shrink:0; }
.mini-btn {
  border: 1px solid var(--border); background:#fff; border-radius: 8px;
  font-size: 11px; font-weight: 700; padding: 5px 8px; color: var(--text-2); white-space:nowrap;
}
.mini-btn.send { color: var(--primary); border-color: var(--primary-light); background: var(--primary-light); }
.mini-btn.confirm { color: var(--pa); border-color: var(--pa); }
.wg-add { display:flex; gap:6px; margin-top: 4px; }
.wg-add input { flex:1; min-width:0; border:1px solid var(--border); border-radius: 9px; padding: 7px 10px; font-size: 13px; background:#fff; }
.wg-add button { background: var(--primary); color:#fff; border:none; border-radius: 9px; padding: 0 12px; font-size: 12px; font-weight:700; }
.wg-link-select { margin-top: 4px; }
.wg-link-select select {
  width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px;
  font-size: 11px; color: var(--text-2); background: #fff;
}
.dot-row { display:flex; justify-content:space-between; padding: 4px 6px 0; }
.dot-cell { text-align:center; flex:1; }
.dot-cell .d { font-size: 10px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
.dot {
  width: 22px; height: 22px; border-radius: 50%; margin: 0 auto;
  border: 2px solid var(--border); background: #fff;
  display:flex; align-items:center; justify-content:center; font-size: 11px; color:#fff;
}
.dot.hit { background: var(--viz-1); border-color: var(--viz-1); }
.dot.today-ring { border-color: var(--primary); border-width: 2px; box-shadow: 0 0 0 2px var(--primary-light); }
.dot.future { opacity: .4; }

/* ─── 목표 ─── */
.vision-card {
  background: linear-gradient(135deg, #163A5C, #1F4E79); color: #fff;
  border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.vision-card .v-label { font-size: 10px; font-weight: 800; opacity: .6; letter-spacing: 1px; margin-bottom: 6px; }
.vision-card .v-text { font-size: 15px; font-weight: 700; line-height: 1.5; }
.vision-card .v-edit { margin-top: 8px; background: rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 5px 10px; font-size: 11px; font-weight:700; }
.goal-card { padding: 0; overflow: hidden; }
.goal-head { padding: 13px 14px 11px; display:flex; align-items:flex-start; gap:8px; }
.goal-tag {
  background: var(--primary); color:#fff; border-radius: 7px; padding: 2px 8px;
  font-size: 11px; font-weight: 800; flex-shrink: 0; margin-top: 1px;
}
.goal-title { font-size: 13.5px; font-weight: 700; flex: 1; line-height: 1.45; }
.mg-list { border-top: 1px solid var(--border); padding: 8px 14px 12px; background: #FBFBF9; }
.mg-row { padding: 7px 0; }
.mg-top { display:flex; align-items:center; gap:8px; }
.mg-month { font-size: 10px; font-weight: 800; color: var(--muted); background: #fff; border:1px solid var(--border); border-radius: 6px; padding: 1px 6px; flex-shrink:0; }
.mg-month.cur { color: var(--primary); border-color: var(--primary-light); background: var(--primary-light); }
.mg-title { font-size: 13px; font-weight: 600; flex:1; min-width:0; }
.mg-pct { font-size: 11px; font-weight: 800; color: var(--text-2); font-variant-numeric: tabular-nums; }
.pbar { height: 6px; background: var(--border); border-radius: 4px; margin-top: 6px; overflow: hidden; }
.pbar > div { height: 100%; background: var(--viz-1); border-radius: 4px; transition: width .25s; }
.mg-ctrl { display: flex; gap: 4px; margin-top: 6px; align-items: center; }
.mg-ctrl .mini-btn { padding: 3px 9px; }
.mg-week-status { font-size: 11px; color: var(--text-2); margin-top: 4px; }
.mg-week-status.linked { color: var(--primary); font-weight: 700; }
.goal-add-btn, .sec-add-btn {
  width: 100%; background: none; border: 1px dashed var(--border); border-radius: 10px;
  padding: 10px; color: var(--muted); font-size: 12px; font-weight: 700;
}
.accordion { margin-bottom: 10px; }
.acc-head {
  width: 100%; background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 12px 14px; display:flex; justify-content:space-between; align-items:center;
  font-size: 13px; font-weight: 800; color: var(--text);
}
.acc-body { display: none; background: var(--card); border: 1px solid var(--hairline); border-top: none; border-radius: 0 0 var(--radius) var(--radius); padding: 12px 14px; margin-top: -8px; }
.accordion.open .acc-head { border-radius: var(--radius) var(--radius) 0 0; }
.accordion.open .acc-body { display: block; }
.pre-text { white-space: pre-wrap; font-size: 13px; color: var(--text-2); line-height: 1.65; }
.edit-btn { background:#fff; border:1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 11px; font-weight: 700; color: var(--primary); margin-top: 10px; }
.edit-area { width: 100%; min-height: 140px; border:1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 13px; line-height: 1.6; margin-top: 8px; }
.role-edit-row { display:flex; align-items:center; gap:8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.role-edit-row:last-child { border-bottom: none; }
.role-edit-row .nm { font-weight: 700; flex: 1; }
.role-edit-row .ds { color: var(--muted); font-size: 11px; }

/* ─── 기록 ─── */
.stat-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
@media (min-width: 768px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
.stat-tile { background: var(--card); border:1px solid var(--hairline); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; }
.stat-tile .lbl { font-size: 11px; font-weight: 700; color: var(--muted); }
.stat-tile .val { font-size: 24px; font-weight: 800; margin-top: 2px; letter-spacing: -0.5px; }
.stat-tile .sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
.hm-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
.hm-nav .m-label { font-weight: 800; font-size: 14px; }
.hm-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.hm-dow { text-align:center; font-size: 10px; color: var(--muted); font-weight: 700; padding-bottom: 2px; }
.hm-cell {
  aspect-ratio: 1; border-radius: 6px; background: var(--bg);
  border: 1px solid var(--hairline);
  display:flex; align-items:center; justify-content:center;
  font-size: 10px; color: var(--muted); position: relative;
}
.hm-cell.lv0 { background: #fff; }
.hm-cell.lv1 { background: var(--seq-100); color: var(--text-2); }
.hm-cell.lv2 { background: var(--seq-200); color: var(--text-2); }
.hm-cell.lv3 { background: var(--seq-350); color: #fff; }
.hm-cell.lv4 { background: var(--seq-500); color: #fff; font-weight: 700; }
.hm-cell.out { visibility: hidden; }
.hm-cell.today-ring { box-shadow: 0 0 0 2px var(--primary); }
.hm-legend { display:flex; align-items:center; gap: 5px; justify-content:flex-end; margin-top: 8px; font-size: 10px; color: var(--muted); }
.hm-legend i { width: 12px; height: 12px; border-radius: 3px; display:inline-block; border:1px solid var(--hairline); }
.gr-row { padding: 7px 0; }

function migrateV2(v2) {
  const d = emptyData();
  d.mission = v2.mission || ''; d.values = v2.values || '';

  d.goalsText = v2.goals || '';
  d.annualGoals = (v2.goals||'').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).map((block,i) => {
    const m = block.match(/^\[([^\]]+)\]\s*([\s\S]+)/);
    return { id:'ag_'+(i+1), tag: m?m[1]:'', title: m?m[2].trim():block, year: new Date().getFullYear() };
  });
  d.roles = v2.roles || [];
  d.weeklyGoals = (v2.weeklyGoals||[]).map(g => ({
    id:g.id, week:g.week, roleId:g.roleId, title:g.title, done:!!g.done,
    deadlineDate:g.deadlineDate||'', monthlyGoalId:null, carriedFrom:null,
    carryCount:((g.note||'').match(/이월/g)||[]).length

// ═══════════════════ 클라우드 동기화 ═══════════════════
let _syncing = false;
function setCloud(msg) { const el = document.getElementById('cloudStatus'); if (el) el.textContent = msg; }
async function cloudSync(manual) {
  if (!CLOUD_SYNC_URL) { setCloud('☁️ 클라우드 미연결'); return; }
  if (_syncing) return;
  _syncing = true;
  const btn = document.getElementById('cloudSyncBtn'); btn.classList.add('syncing');
  setCloud('☁️ 동기화 중...');
  try {
    const res = await fetch(CLOUD_SYNC_URL + '?action=read');
    const result = await res.json();
    if (result.status === 'ok' && result.data) {
      const remote = result.data;
      if ((remote._version|0) >= 3) {
        const rT = new Date(remote._modified || remote._synced || 0).getTime();
        const lT = new Date(D._modified || 0).getTime();
        if (rT > lT && !_dirty) {
          D = normalize(remote); persist(); renderAll();
        }
      }
      // remote v2 → 이미 시드로 이관됨: pull 생략, v3로 덮어씀
    }
    const payload = JSON.parse(JSON.stringify(D));
    payload._exported = new Date().toISOString();
    payload._device = /iPad|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document ? 'ipad'
                    : /Mobile/.test(navigator.userAgent) ? 'phone' : 'desktop';
    await fetch(CLOUD_SYNC_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action:'save', data: payload, source:'planner_v3' }),
      mode: 'no-cors'
    });
    _dirty = false;
    setCloud('☁️ ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) + ' 동기화됨');
    if (manual) showToast('☁️ 동기화 완료');
  } catch(err) {
    console.error('cloudSync', err);
    setCloud('☁️ 동기화 실패');
    if (manual) showToast('동기화 실패: ' + err.message);
  } finally {
    _syncing = false; btn.classList.remove('syncing');
  }
}

function tasksOf(date) { return D.dailyTasks.filter(t => t.date === date); }
function isAchieved(date) {

}
function reflectionOf(date) { return D.reflections.find(r => r.date === date); }
function recordAchievement(date) {

  else r.achieved = ach;
}
function achievedOn(date) {
  const r = reflectionOf(date);
  if (r) return !!r.achieved;
  return isAchieved(date);
}
function currentStreak() {
  let n = 0; const d = new Date();
  if (!achievedOn(dstr(d))) d.setDate(d.getDate()-1); // 오늘 미달성은 아직 진행 중으로 간주
  while (achievedOn(dstr(d))) { n++; d.setDate(d.getDate()-1); }
  return n;
}
function bestStreak() {
  const days = new Set(D.reflections.filter(r=>r.achieved).map(r=>r.date));
  D.dailyTasks.forEach(t => { if (isAchieved(t.date)) days.add(t.date); });
  let best = 0;
  days.forEach(ds => {
    const prev = new Date(ds+'T00:00:00'); prev.setDate(prev.getDate()-1);
    if (days.has(dstr(prev))) return; // 시작점만
    let n = 0; const d = new Date(ds+'T00:00:00');
    while (days.has(dstr(d))) { n++; d.setDate(d.getDate()+1); }
    best = Math.max(best, n);
  });
  return best;
}

// ═══════════════════ 구글 캘린더 (Apps Script events 엔드포인트) ═══════════════════
let _events = null;
try { const _ec = JSON.parse(localStorage.getItem('dp3_events') || 'null'); if (_ec) _events = _ec.events; } catch(e) {}
async function fetchEvents() {
  if (!CLOUD_SYNC_URL) return;
  try {
    const res = await fetch(CLOUD_SYNC_URL + '?action=events&days=2');
    const r = await res.json();
    if (r.status === 'ok' && Array.isArray(r.events)) {
      _events = r.events;
      try { localStorage.setItem('dp3_events', JSON.stringify({ at: Date.now(), events: r.events })); } catch(e) {}
      renderToday();
    }
  } catch(e) { /* 백엔드 미지원/오프라인 시 조용히 무시 */ }
}
function eventsOnDay(ds) {
  if (!_events) return [];
  const noon = new Date(ds + 'T12:00:00');
  return _events.filter(ev => {
    const s = new Date(ev.start), e = new Date(ev.end);
    if (ev.allDay) return noon >= s && noon < e;
    return dstr(s) === ds;
  });
}
function hhmm(iso) { const d = new Date(iso); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function eventsCardHtml(td) {
  if (!_events) return '';
  const todays = eventsOnDay(td);
  const tmr = new Date(td + 'T00:00:00'); tmr.setDate(tmr.getDate() + 1);
  const tmrCnt = eventsOnDay(dstr(tmr)).length;
  if (!todays.length && !tmrCnt) return '';
  const now = new Date();
  todays.sort((a,b) => (a.allDay ? '0' : '1' + a.start).localeCompare(b.allDay ? '0' : '1' + b.start));
  let rows = '';
  todays.forEach(ev => {
    const s = new Date(ev.start), e = new Date(ev.end);
    const ongoing = !ev.allDay && now >= s && now < e;
    const past = !ev.allDay && now >= e;
    rows += `<div class="ev-row ${ongoing?'now':''} ${past?'past':''}">
      <span class="ev-time ${ev.allDay?'allday':''}">${ev.allDay ? '종일' : hhmm(ev.start) + '–' + hhmm(ev.end)}</span>
      <span class="ev-title">${esc(ev.title)}</span>
      ${ongoing ? '<span class="ev-now-badge">진행 중</span>' : ''}
    </div>`;
  });
  if (!todays.length) rows = `<div class="sec-note">오늘 일정이 없습니다</div>`;
  return `<div class="card ev-card">
    <h3>📅 오늘 일정 <span class="sec-note">Google 캘린더</span></h3>
    ${rows}
    ${tmrCnt ? `<div class="ev-tomorrow">내일 일정 ${tmrCnt}건</div>` : ''}
  </div>`;
}

function shorten(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }

  commit(); renderToday();
}
function toggleTask(id) {

  commit(); renderToday();
}
function cycleTaskPri(id) {
  const t = D.dailyTasks.find(t => t.id === id); if (!t) return;
  let next = { A:'B', B:'C', C:'A' }[t.priority];
  if (next === 'A' && tasksOf(t.date).filter(x => x.priority === 'A' && x.id !== id).length >= 3) {
    next = 'B';
    showToast('A가 가득 차서(3/3) B로 이동했습니다');
  }

  recordAchievement(t.date);
  commit(); renderToday();
}
function delTask(id) {

    btn.classList.add('confirm'); btn.textContent = '삭제?';
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove('confirm'); btn.textContent = '✕'; } }, 2500);
    return;
  }
  const t = D.dailyTasks.find(t=>t.id===id);
  D.dailyTasks = D.dailyTasks.filter(t => t.id !== id);
  if (t) recordAchievement(t.date);
  commit(); renderToday();
}
function moveTaskToToday(id) {

  const td = todayStr();

  if (pri === 'A' && tasksOf(td).filter(x => x.priority === 'A').length >= 3) {

    showToast(`어제 항목을 오늘의 ${pri}로 이동했습니다`);

  commit(); renderToday();

function originWeekOf(g) {
  let cur = g, guard = 0;
  while (cur && cur.carriedFrom && guard++ < 20) {
    const p = D.weeklyGoals.find(x => x.id === cur.carriedFrom);
    if (!p) break; cur = p;
  }
  return cur ? cur.week : g.week;
}

  }).join('');
  return `<div class="wg-link-select"><select onchange="linkRock('${g.id}', this.value)">
    <option value="">🎯 월간 목표 연결...</option>${opts}</select></div>`;
}

function moveRole(id, d) {

  const j = i + d;
  if (i < 0 || j < 0 || j >= D.roles.length) return;
  [D.roles[i], D.roles[j]] = [D.roles[j], D.roles[i]];
  commit(); manageRoles();
}
function removeRole(id) {

    btn.classList.add('confirm');
    btn.textContent = cnt ? `빅록 ${cnt}개 포함 삭제?` : '삭제?';
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove('confirm'); btn.textContent = '✕'; } }, 3000);
    return;

  D.roles = D.roles.filter(r => r.id !== id);
  commit(); manageRoles();
}

function sendToToday(id) {

  if (D.dailyTasks.some(t => t.date === td && t.weeklyGoalId === id)) {

  commit();

function carryOver(id) {

  const [y, w] = g.week.split('-W');
  // 해당 주의 시작일 + 7일
  const base = mondayOfWeek(g.week);
  base.setDate(base.getDate() + 7);
  carryTo(g, getWeekKey(base));
}
function carryInto(id, wk) {
  const g = D.weeklyGoals.find(g => g.id === id); if (!g) return;
  carryTo(g, wk);

function carryTo(g, targetWk) {
  if (D.weeklyGoals.some(x => x.carriedFrom === g.id)) { showToast('이미 이월된 항목입니다'); return; }
  D.weeklyGoals.push({
    id: uid('wg_'), week: targetWk, roleId: g.roleId, title: g.title, done:false,
    deadlineDate: g.deadlineDate || '', monthlyGoalId: g.monthlyGoalId,
    carriedFrom: g.id, carryCount: (g.carryCount||0) + 1
  });
  commit(); showToast(`↻ ${targetWk}로 이월 (${(g.carryCount||0)+1}회차)`);
  renderWeekly();

function dropGoal(id) {
  const g = D.weeklyGoals.find(g => g.id === id); if (!g) return;
  g.done = true; // 놓아주기 = 종결 처리
  commit(); showToast('놓아줬습니다. 더 중요한 것에 집중하세요.');
  renderWeekly();

function mondayOfWeek(wk) {
  // week key와 일치하는 월요일 찾기 (연초부터 스캔)
  const y = parseInt(wk.slice(0,4));
  let d = getWeekStart(new Date(y, 0, 1));
  for (let i = 0; i < 60; i++) {
    if (getWeekKey(d) === wk && d.getFullYear() >= y-1) {
      const chk = new Date(d); chk.setDate(chk.getDate()+3);
      if (getWeekKey(getWeekStart(chk)) === wk) return new Date(d);
    }
    d.setDate(d.getDate() + 7);
  }
  return getWeekStart(new Date());
}

    <label>이번 달 한 줄 총평</label>

    }
    html += `<div class="mg-week-status ${wkRocks.length?'linked':''}">${wkRocks.length ? `🧭 이번 주 빅록 ${wkRocks.length}개 연결됨` : '이번 주 연결된 빅록 없음'}</div>
      <button class="sec-add-btn" style="margin-top:8px" onclick="addMonthlyGoal('${ag.id}')">＋ 월간 목표</button>
      </div></div>`;
  });
  html += `<button class="goal-add-btn" onclick="editAnnualGoal(null)">＋ 연간 목표 추가</button>`;

  // 미션/가치/역할 전문 (읽기 기본)
  html += `<div style="margin-top:18px">`;
  html += accordionHtml('acc-mission', '📜 사명 (Mission)', `
    <div class="pre-text" id="missionView">${esc(D.mission)}</div>
    <button class="edit-btn" onclick="editLongText('mission')">편집</button>`);
  html += accordionHtml('acc-values', '💎 가치 (Values)', `
    <div class="pre-text">${esc(D.values)}</div>
    <button class="edit-btn" onclick="editLongText('values')">편집</button>`);
  html += accordionHtml('acc-roles', '👥 역할 (Roles)', `
    ${D.roles.map(r => `<div class="role-edit-row"><span>${esc(r.icon)}</span><span class="nm">${esc(r.name)}</span><span class="ds">${esc(r.desc||'')}</span>
      <button class="x-btn" style="font-size:12px" onclick="editRole('${r.id}')">✎</button></div>`).join('')}
    <button class="edit-btn" onclick="editRole(null)">＋ 역할 추가</button>`);
  html += `</div>`;
  wrap.innerHTML = html;
}
function accordionHtml(id, title, body) {
  return `<div class="accordion" id="${id}">
    <button class="acc-head" onclick="document.getElementById('${id}').classList.toggle('open')">${title}<span>▾</span></button>
    <div class="acc-body">${body}</div>
  </div>`;
}
function bumpProgress(id, d) {
  const m = D.monthlyGoals.find(m => m.id === id); if (!m) return;
  m.progress = Math.max(0, Math.min(100, (m.progress|0) + d));
  commit(); renderGoals();
}
function delMonthlyGoal(id) {
  const btn = document.getElementById('delmg_' + id);
  if (btn && !btn.classList.contains('confirm')) {
    btn.classList.add('confirm'); btn.textContent = '삭제?';
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove('confirm'); btn.textContent = '✕'; } }, 2500);
    return;
  }
  D.monthlyGoals = D.monthlyGoals.filter(m => m.id !== id);
  D.weeklyGoals.forEach(g => { if (g.monthlyGoalId === id) g.monthlyGoalId = null; });
  commit(); renderGoals();
}

// ═══════════════════ 모달 (공용 폼) ═══════════════════
function openModal(html) { document.getElementById('modalRoot').innerHTML = `<div class="modal-ov" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
function editVision() {
  openModal(`<h3>비전 선언문</h3>
    <label>한 줄로 나를 정의하면</label>
    <textarea id="mVision">${esc(D.vision)}</textarea>
    <button class="m-primary" onclick="saveVision()">저장</button>
    <button class="m-cancel" onclick="closeModal()">취소</button>`);
}
function saveVision() {
  D.vision = document.getElementById('mVision').value.trim();
  commit(); closeModal(); renderGoals();
}
function editLongText(field) {
  const names = { mission:'사명 (Mission)', values:'가치 (Values)' };
  openModal(`<h3>${names[field]}</h3>
    <textarea id="mLong" style="min-height:220px">${esc(D[field])}</textarea>
    <button class="m-primary" onclick="saveLongText('${field}')">저장</button>
    <button class="m-cancel" onclick="closeModal()">취소</button>`);
}
function saveLongText(field) {
  D[field] = document.getElementById('mLong').value;
  if (field === 'mission' && !D.vision) D.vision = D.mission.split('\n').map(s=>s.trim()).filter(Boolean)[0] || '';
  commit(); closeModal(); renderGoals();
}
function editAnnualGoal(id) {
  const ag = id ? D.annualGoals.find(a => a.id === id) : null;
  openModal(`<h3>${ag ? '연간 목표 편집' : '연간 목표 추가'}</h3>
    <label>역할 태그 (예: 학자, 개발자)</label>
    <input type="text" id="mTag" value="${ag?esc(ag.tag):''}">
    <label>목표</label>
    <textarea id="mTitle">${ag?esc(ag.title):''}</textarea>
    <button class="m-primary" onclick="saveAnnualGoal(${ag?`'${ag.id}'`:'null'})">저장</button>
    ${ag ? `<button class="m-cancel" style="color:var(--pa)" onclick="deleteAnnualGoal('${ag.id}')">이 목표 삭제</button>` : ''}
    <button class="m-cancel" onclick="closeModal()">취소</button>`);
}
function saveAnnualGoal(id) {
  const tag = document.getElementById('mTag').value.trim();
  const title = document.getElementById('mTitle').value.trim();
  if (!title) { showToast('목표를 입력하세요'); return; }
  if (id) {
    const ag = D.annualGoals.find(a => a.id === id);
    ag.tag = tag; ag.title = title;
  } else {
    D.annualGoals.push({ id: uid('ag_'), tag, title, year: new Date().getFullYear() });
  }
  commit(); closeModal(); renderGoals();
}
function deleteAnnualGoal(id) {
  const mgIds = D.monthlyGoals.filter(m => m.goalId === id).map(m => m.id);
  D.monthlyGoals = D.monthlyGoals.filter(m => m.goalId !== id);
  D.weeklyGoals.forEach(g => { if (mgIds.includes(g.monthlyGoalId)) g.monthlyGoalId = null; });
  D.annualGoals = D.annualGoals.filter(a => a.id !== id);
  commit(); closeModal(); renderGoals();
}
function addMonthlyGoal(goalId) { editMonthlyGoalForm(null, goalId); }
function editMonthlyGoal(id) { editMonthlyGoalForm(id, null); }
function editMonthlyGoalForm(id, goalId) {
  const m = id ? D.monthlyGoals.find(m => m.id === id) : null;
  const gid = m ? m.goalId : goalId;
  const ag = D.annualGoals.find(a => a.id === gid);
  openModal(`<h3>${m ? '월간 목표 편집' : '월간 목표 추가'}</h3>
    <div class="sec-note">🎯 [${esc(ag?ag.tag:'')}] ${esc(shorten(ag?ag.title:'', 40))}</div>
    <label>월</label>
    <input type="month" id="mMonth" value="${m ? m.month : todayStr().slice(0,7)}">
    <label>목표</label>
    <input type="text" id="mMgTitle" value="${m?esc(m.title):''}" placeholder="이번 달에 이루면 되는 것">
    <button class="m-primary" onclick="saveMonthlyGoal(${m?`'${m.id}'`:'null'}, '${gid}')">저장</button>
    <button class="m-cancel" onclick="closeModal()">취소</button>`);
}
function saveMonthlyGoal(id, goalId) {
  const month = document.getElementById('mMonth').value;
  const title = document.getElementById('mMgTitle').value.trim();
  if (!title || !month) { showToast('월과 목표를 입력하세요'); return; }
  if (id) {
    const m = D.monthlyGoals.find(m => m.id === id);
    m.month = month; m.title = title;
  } else {
    D.monthlyGoals.push({ id: uid('mg_'), month, goalId, title, progress: 0 });
  }
  commit(); closeModal(); renderGoals();
}
function editRole(id) {
  const r = id ? D.roles.find(r => r.id === id) : null;
  openModal(`<h3>${r ? '역할 편집' : '역할 추가'}</h3>
    <label>아이콘 (이모지)</label>
    <input type="text" id="mIcon" value="${r?esc(r.icon):'⭐'}">
    <label>이름</label>
    <input type="text" id="mName" value="${r?esc(r.name):''}">
    <label>설명</label>
    <input type="text" id="mDesc" value="${r?esc(r.desc||''):''}">
    <button class="m-primary" onclick="saveRole(${r?`'${r.id}'`:'null'})">저장</button>
    ${r ? `<button class="m-cancel" style="color:var(--pa)" onclick="deleteRole('${r.id}')">이 역할 삭제</button>` : ''}
    <button class="m-cancel" onclick="closeModal()">취소</button>`);
}
function saveRole(id) {
  const icon = document.getElementById('mIcon').value.trim() || '⭐';
  const name = document.getElementById('mName').value.trim();
  if (!name) { showToast('역할 이름을 입력하세요'); return; }
  const desc = document.getElementById('mDesc').value.trim();
  if (id) { const r = D.roles.find(r => r.id === id); r.icon = icon; r.name = name; r.desc = desc; }
  else D.roles.push({ id: String(Date.now()), icon, name, desc });
  commit(); closeModal(); renderGoals(); renderWeekly();
}
function deleteRole(id) {
  D.roles = D.roles.filter(r => r.id !== id);
  commit(); closeModal(); renderGoals(); renderWeekly();
}

// ═══════════════════ ④ 기록 ═══════════════════
let hmMonth = todayStr().slice(0,7);
function moveMonth(n) {
  const [y, m] = hmMonth.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  hmMonth = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  renderRecords();
}
function renderRecords() {
  const wrap = document.getElementById('recordsWrap');
  const td = todayStr();

  // 통계
  const last30 = [];
  for (let i = 0; i < 30; i++) { const d = new Date(); d.setDate(d.getDate()-i); last30.push(dstr(d)); }
  let aTot = 0, aDone = 0;
  last30.forEach(ds => tasksOf(ds).forEach(t => { if (t.priority === 'A') { aTot++; if (t.done) aDone++; } }));
  const aRate = aTot ? Math.round(aDone/aTot*100) : 0;

  let compassRun = 0, compassTot = 0;
  for (let i = 0; i < 12; i++) {
    const ws = getWeekStart(new Date()); ws.setDate(ws.getDate() - 7*i);
    const wk = getWeekKey(ws);
    compassTot++;
    if (compassDone(wk)) compassRun++;
  }
  const compassRate = Math.round(compassRun/compassTot*100);

  const [cy, cm] = hmMonth.split('-').map(Number);
  const daysInM = new Date(cy, cm, 0).getDate();
  let monthAch = 0;
  for (let i = 1; i <= daysInM; i++) {
    const ds = hmMonth + '-' + String(i).padStart(2,'0');
    if (achievedOn(ds)) monthAch++;
  }

  let html = `
  <div class="subnav"><button class="nav-chip back" onclick="showTab('today')">‹ 오늘</button><span class="pgtitle">📊 기록</span></div>
  <div class="stat-grid">
    <div class="stat-tile"><div class="lbl">🔥 현재 스트릭</div><div class="val">${currentStreak()}일</div><div class="sub">최고 ${bestStreak()}일</div></div>
    <div class="stat-tile"><div class="lbl">✅ A 완료율</div><div class="val">${aRate}%</div><div class="sub">최근 30일 (${aDone}/${aTot})</div></div>
    <div class="stat-tile"><div class="lbl">🧭 나침반 실행률</div><div class="val">${compassRate}%</div><div class="sub">최근 12주 중 ${compassRun}주</div></div>
    <div class="stat-tile"><div class="lbl">📅 이번 달 달성</div><div class="val">${monthAch}일</div><div class="sub">${hmMonth}</div></div>
  </div>`;

  // 히트맵
  html += `<div class="card">
    <div class="hm-nav">
      <button class="wnav-btn" onclick="moveMonth(-1)">‹</button>
      <span class="m-label">${cy}년 ${cm}월</span>
      <button class="wnav-btn" onclick="moveMonth(1)">›</button>
    </div>
    <div class="hm-grid">${DOW.map(d=>`<div class="hm-dow">${d}</div>`).join('')}`;
  const first = new Date(cy, cm-1, 1);
  const lead = (first.getDay()+6) % 7; // 월요일 시작
  for (let i = 0; i < lead; i++) html += `<div class="hm-cell out"></div>`;
  for (let day = 1; day <= daysInM; day++) {
    const ds = hmMonth + '-' + String(day).padStart(2,'0');
    const dayTasks = tasksOf(ds);
    const as = dayTasks.filter(t=>t.priority==='A');
    const doneCnt = dayTasks.filter(t=>t.done).length;
    let lv = 'lv0';
    let tip = ds;
    if (achievedOn(ds)) { lv = 'lv4'; tip += ' · 달성!'; }
    else if (as.length && as.some(t=>t.done)) { lv = 'lv2'; tip += ` · A ${as.filter(t=>t.done).length}/${as.length}`; }
    else if (doneCnt) { lv = 'lv1'; tip += ` · ${doneCnt}개 완료`; }
    else if (!dayTasks.length) { lv = 'lv0'; }
    html += `<div class="hm-cell ${lv} ${ds===td?'today-ring':''}" title="${tip}">${day}</div>`;
  }
  html += `</div>
    <div class="hm-legend">적음 <i style="background:#fff"></i><i style="background:var(--seq-100)"></i><i style="background:var(--seq-200)"></i><i style="background:var(--seq-350)"></i><i style="background:var(--seq-500)"></i> 달성</div>
  </div>`;

  // 목표별 달성률
  const goalRows = D.annualGoals.map(ag => {
    const mgs = D.monthlyGoals.filter(m => m.goalId === ag.id);
    if (!mgs.length) return null;
    const avg = Math.round(mgs.reduce((s,m)=>s+(m.progress|0),0) / mgs.length);
    return { ag, avg, n: mgs.length };
  }).filter(Boolean);
  if (goalRows.length) {
    html += `<div class="card"><h3>🎯 목표별 달성률 <span class="sec-note">월간 목표 진행률 평균</span></h3>`;
    goalRows.forEach(({ag, avg, n}) => {
      html += `<div class="gr-row">
        <div class="gr-top"><span class="gr-name">[${esc(ag.tag)}] ${esc(shorten(ag.title, 30))}</span><span class="gr-pct">${avg}% <span style="font-weight:500;color:var(--muted)">(${n}개)</span></span></div>
        <div class="pbar"><div style="width:${avg}%"></div></div>
      </div>`;
    });
    html += `</div>`;
  }

  // 월간 점검 기록
  const mrs = Object.entries(D.monthlyReviews || {}).sort((a,b) => b[0].localeCompare(a[0]));
  if (mrs.length) {
    html += `<div class="card"><h3>📆 월간 점검 기록</h3>`;
    mrs.forEach(([m, r]) => {
      html += `<div class="tl-row">
        <div class="tl-dot hit"></div>
        <div class="tl-date">${esc(m)}</div>
        <div class="tl-text">${esc(r.note || '(총평 없음)')}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // 회고 타임라인
  const refls = D.reflections.filter(r => r.text).sort((a,b) => b.date.localeCompare(a.date)).slice(0, 30);
  html += `<div class="card"><h3>🌙 회고 타임라인</h3>`;
  if (refls.length) {
    refls.forEach(r => {
      html += `<div class="tl-row">
        <div class="tl-dot ${r.achieved?'hit':''}"></div>
        <div class="tl-date">${r.date.slice(5)}</div>
        <div class="tl-text">${esc(r.text)}</div>
      </div>`;
    });
  } else {
    html += `<div class="empty-hint">저녁 회고를 쌓아가면 여기에 타임라인이 생깁니다.</div>`;
  }
  html += `</div>`;
  wrap.innerHTML = html;
}

// ═══════════════════ 데이터 모달 (내보내기/가져오기) ═══════════════════
function openDataModal() {
  openModal(`<h3>⚙️ 데이터</h3>
    <button class="m-btn" onclick="cloudSync(true);closeModal()">☁️ <span>지금 동기화<small>Google Drive와 즉시 동기화</small></span></button>
    <button class="m-btn" onclick="exportJSON()">📤 <span>내보내기<small>JSON 파일 백업 (v3 포맷)</small></span></button>
    <button class="m-btn" onclick="document.getElementById('importFile').click()">📥 <span>가져오기<small>v2/v3 JSON 파일 불러오기</small></span></button>
    <button class="m-btn" onclick="openRestoreModal()">🛟 <span>백업 복원<small>이 기기의 자동 백업(최근 7일)에서 되돌리기</small></span></button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importJSON(this)">
    <button class="m-cancel" onclick="closeModal()">닫기</button>`);
}
function openRestoreModal() {
  const baks = Object.keys(localStorage).filter(x => x.startsWith('dp3_bak_') && x !== 'dp3_bak_prerestore').sort().reverse();
  if (!baks.length) { showToast('저장된 로컬 백업이 없습니다'); return; }
  const rows = baks.map(k => {
    let info = '';
    try { const d = JSON.parse(localStorage.getItem(k)); info = `빅록 ${(d.weeklyGoals||[]).length} · 할일 ${(d.dailyTasks||[]).length} · 회고 ${(d.reflections||[]).length}`; } catch(e) {}
    return `<button class="m-btn" onclick="restoreBackup('${k}')">🗓 <span>${k.slice(8)}<small>${info}</small></span></button>`;
  }).join('');
  openModal(`<h3>🛟 백업 복원</h3>
    <div class="sec-note" style="margin-bottom:10px">복원 직전 상태도 자동 보관되므로 안전하게 되돌릴 수 있습니다.</div>
    ${rows}
    <button class="m-cancel" onclick="closeModal()">취소</button>`);
}
function restoreBackup(key) {
  try {
    const raw = localStorage.getItem(key); if (!raw) return;
    localStorage.setItem('dp3_bak_prerestore', JSON.stringify(D));
    D = normalize(JSON.parse(raw));
    D._modified = new Date().toISOString();
    persist(); _dirty = true;
    closeModal(); renderAll();
    showToast('🛟 ' + key.slice(8) + ' 백업으로 복원했습니다');
  } catch(e) { showToast('복원 실패: ' + e.message); }
}
function exportJSON() {
  const payload = JSON.parse(JSON.stringify(D));
  payload._exported = new Date().toISOString();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dual_planner_v3_' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('📤 내보내기 완료');
}
function importJSON(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const obj = JSON.parse(e.target.result);
      if (obj._format !== 'dual_planner_sync') throw new Error('플래너 데이터 파일이 아닙니다');
      D = (obj._version|0) >= 3 ? normalize(obj) : migrateV2(obj);
      D._modified = new Date().toISOString();
      persist(); _dirty = true;
      closeModal(); renderAll();
      showToast('📥 가져오기 완료' + ((obj._version|0) < 3 ? ' (v2 → v3 변환됨)' : ''));
    } catch(err) { showToast('가져오기 실패: ' + err.message); }
  };
  reader.readAsText(file);
  input.value = '';
}

// ═══════════════════ 시작 ═══════════════════
renderAll();
if (CLOUD_SYNC_URL) {
  setCloud('☁️ 대기 중');
  setTimeout(() => cloudSync(false), 2000);
  setTimeout(fetchEvents, 2800);
  setTimeout(fetchSuggestions, 3500);
  setInterval(() => { cloudSync(false); fetchEvents(); fetchSuggestions(); }, 5*60*1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { cloudSync(false); fetchEvents(); fetchSuggestions(); } });
} else setCloud('☁️ 클라우드 미연결');
</script>
